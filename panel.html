<template class="iv-tool-panel-tpl">
  <div class="iv-tool-panel">
    <div class="iv-tool-header" data-drag>
      <span class="iv-tool-name"></span>
      <span class="iv-tool-close" data-close>✕</span>
    </div>

    <div class="iv-tool-hero">
      <img class="iv-tool-img" alt="pokemon imagem" hidden />

      <div class="iv-tool-id">
        <div class="iv-tool-lvl">
          <b class="iv-tool-level"></b> ·
          <b class="iv-tool-power"></b>
        </div>
        <div class="iv-tool-types"></div>
      </div>
    </div>
    <p class="iv-tool-dica">O cálculo de iv no lvl 20 tem precisão máxima.</p>
    <div class="iv-tool-tabs">
      <button class="iv-tool-tab is-active" data-tab="iv">IV Calc</button>
      <button class="iv-tool-tab" data-tab="moves">Moves</button>
      <button class="iv-tool-tab" data-tab="farm">Rotas</button>
    </div>

    <div class="iv-tool-pane" data-pane="iv">
      <div class="iv-tool-meta"><b></b></div>

      <table class="iv-tool-table"></table>

      <div class="iv-tool-footer">
        <div class="iv-tool-total-row">
          <span>IV Total</span>
          <span><b class="iv-tool-total"></b>/192</span>
        </div>
        <div class="iv-tool-bar">
          <div class="iv-tool-total-fill"></div>
        </div>
      </div>
    </div>

    <div class="iv-tool-pane" data-pane="moves" hidden>
      <div class="iv-tool-moves"></div>
    </div>

    <div class="iv-tool-pane" data-pane="farm" hidden>
      <div class="iv-tool-farm"></div>
    </div>

    <div class="iv-tool-error" hidden></div>
  </div>
</template>

<template class="iv-tool-row">
  <tr>
    <td class="iv-tool-stat"></td>
    <td class="iv-tool-bar-cell">
      <div class="iv-tool-bar">
        <div class="iv-tool-fill"></div>
      </div>
    </td>
    <td class="iv-tool-val"></td>
  </tr>
</template>

<template class="iv-tool-legend-tpl">
  <div class="iv-tool-legend">
    <div class="iv-tool-legend-header" data-drag>
      <span>Legenda</span>
      <span class="iv-tool-legend-close" data-close>×</span>
    </div>
    <div class="iv-tool-legend-body"></div>
  </div>
</template>

<template class="iv-tool-legend-uncaught">
  <div class="iv-tool-legend-item">
    <span class="iv-tool-legend-swatch"></span>
    <span>Não capturados</span>
    <span class="iv-tool-legend-count"></span>
  </div>
</template>

<template class="iv-tool-legend-farm">
  <div class="iv-tool-legend-group">
    <div class="iv-tool-legend-item">
      <span class="iv-tool-legend-swatch" style="background: #0b4c96"></span>
      <span>Super Efetivo ×2</span>
    </div>
    <div class="iv-tool-legend-item">
      <span class="iv-tool-legend-swatch" style="background: #ff9500"></span>
      <span>Super Efetivo ×4</span>
    </div>
  </div>
</template>

<template class="iv-tool-legend-hint">
  <div class="iv-tool-legend-item">
    <kbd class="iv-tool-kbd">Alt</kbd> +
    <kbd class="iv-tool-kbd">K</kbd>
    <span>Aperte Alt + K </span>
    <span>para exibir a legenda</span>
  </div>
</template>

<template class="iv-tool-legend-caught">
  <div class="iv-tool-legend-item">
    <span>✅ Tudo capturado.</span>
  </div>
</template>
